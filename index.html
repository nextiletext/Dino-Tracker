<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Global Dino Tracker</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #030712;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      color: #f3f4f6;
    }

    #globeViz {
      width: 100vw;
      height: 100vh;
    }

    /* UI Overlay */
    .header {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      pointer-events: none;
    }

    h1 {
      margin: 0;
      font-size: 1.8rem;
      letter-spacing: 2px;
      color: #22c55e;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
    }

    p {
      margin: 5px 0 0 0;
      font-size: 0.9rem;
      color: #9ca3af;
    }

    /* Info Panel for Active Sightings */
    #info-panel {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 280px;
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      display: none;
    }

    #info-panel h3 {
      margin-top: 0;
      color: #ef4444;
      font-size: 1.1rem;
    }

    .stat {
      font-size: 0.85rem;
      margin-bottom: 6px;
    }

    .stat-label {
      color: #9ca3af;
    }
  </style>

  <script src="//unpkg.com/globe.gl"></script>
</head>
<body>

  <div class="header">
    <h1>DinoTracker Live</h1>
    <p>Real-time Fictional Containment & Sightings Map</p>
  </div>

  <div id="globeViz"></div>

  <div id="info-panel">
    <h3 id="dino-species">Species Name</h3>
    <div class="stat"><span class="stat-label">Location:</span> <span id="dino-location">-</span></div>
    <div class="stat"><span class="stat-label">Threat Level:</span> <span id="dino-threat">-</span></div>
    <div class="stat"><span class="stat-label">Status:</span> <span id="dino-status">-</span></div>
  </div>

  <script>
    // Mock Sighting Data (Latitude, Longitude, Threat, Name)
    const dinoSightings = [
      { name: "Tyrannosaurus Rex", lat: 40.7128, lng: -74.0060, location: "New York, USA", threat: "CRITICAL", color: "#ef4444" },
      { name: "Velociraptor Pack", lat: 51.5074, lng: -0.1278, location: "London, UK", threat: "HIGH", color: "#f97316" },
      { name: "Spinosaurus", lat: 30.0444, lng: 31.2357, location: "Cairo, Egypt", threat: "CRITICAL", color: "#ef4444" },
      { name: "Triceratops", lat: -33.8688, lng: 151.2093, location: "Sydney, Australia", threat: "LOW", color: "#eab308" },
      { name: "Brachiosaurus", lat: -22.9068, lng: -43.1729, location: "Rio de Janeiro, Brazil", threat: "LOW", color: "#22c55e" },
      { name: "Dilophosaurus", lat: 35.6762, lng: 139.6503, location: "Tokyo, Japan", threat: "MEDIUM", color: "#f97316" },
      { name: "Pteranodon", lat: -1.2921, lng: 36.8219, location: "Nairobi, Kenya", threat: "MEDIUM", color: "#f97316" }
    ];

    // Initialize Globe
    const world = Globe()
      (document.getElementById('globeViz'))
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
      .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
      
      // Add red/orange/yellow glowing rings for sightings
      .ringsData(dinoSightings)
      .ringColor(d => t => `rgba(${d.threat === 'CRITICAL' ? '239, 68, 68' : '234, 179, 8'}, ${1 - t})`)
      .ringMaxRadius(5)
      .ringPropagationSpeed(3)
      .ringRepeatPeriod(1000)

      // Add dot markers
      .pointsData(dinoSightings)
      .pointColor(d => d.color)
      .pointAltitude(0.02)
      .pointRadius(0.6)
      
      // Click interaction
      .onPointClick(point => {
        // Auto-focus camera on clicked marker
        world.pointOfView({ lat: point.lat, lng: point.lng, altitude: 1.5 }, 1000);
        
        // Show info panel with dino data
        document.getElementById('info-panel').style.display = 'block';
        document.getElementById('dino-species').innerText = point.name;
        document.getElementById('dino-location').innerText = point.location;
        document.getElementById('dino-threat').innerText = point.threat;
        document.getElementById('dino-status').innerText = "Active Search Engaged";
      });

    // Auto-rotate globe slowly
    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.5;
  </script>
</body>
</html>
