    const searchInput = document.getElementById('dino-search');
const searchBtn = document.getElementById('search-btn');
const searchError = document.getElementById('search-error');
const searchResults = document.getElementById('search-results');

// 1. Live Dropdown Filtering as the user types
searchInput.addEventListener('input', () => {
  const query = searchInput.value.trim().toLowerCase();
  searchError.style.display = 'none';
  searchResults.innerHTML = '';

  if (!query) {
    searchResults.style.display = 'none';
    return;
  }

  // Find all dinosaurs matching the typed query
  const matches = dinoSightings.filter(d => 
    d.name && d.name.toLowerCase().includes(query)
  );

  if (matches.length > 0) {
    searchResults.style.display = 'block';
    matches.forEach(match => {
      const item = document.createElement('div');
      item.className = 'search-item';
      item.innerText = match.name;
      
      // Click item in dropdown to navigate
      item.addEventListener('click', () => {
        goToDino(match);
      });
      searchResults.appendChild(item);
    });
  } else {
    searchResults.style.display = 'none';
  }
});

// 2. Perform Exact Search (Button or Enter Key)
function performSearch() {
  const query = searchInput.value.trim().toLowerCase();
  searchResults.style.display = 'none';

  if (!query) return;

  // Require an EXACT name match so incomplete/invalid names trigger the error
  const exactMatch = dinoSightings.find(d => 
    d.name && d.name.toLowerCase() === query
  );

  if (exactMatch) {
    goToDino(exactMatch);
  } else {
    // Show error if invalid, incomplete, or not in array
    searchError.innerText = "Sorry that dinosaur is not in our database";
    searchError.style.display = 'block';
  }
}

// 3. Helper to fly camera and open card
function goToDino(dino) {
  world.pointOfView({ lat: dino.lat, lng: dino.lng, altitude: 1.6 }, 1500);
  openCard(dino);
  searchInput.value = '';
  searchResults.style.display = 'none';
  searchError.style.display = 'none';
}

// Event Listeners
searchBtn.addEventListener('click', performSearch);
searchInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') performSearch();
});

// Hide dropdown if clicking anywhere outside the search container
document.addEventListener('click', (e) => {
  if (!document.getElementById('search-container').contains(e.target)) {
    searchResults.style.display = 'none';
  }
});
