<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Global Dino Tracker - Tactical Grid</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #030712;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      color: #f3f4f6;
    }

    #globeViz {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }

    #globeViz canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    .header {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 100;
      pointer-events: none;
    }

    h1 {
      margin: 0;
      font-size: 1.6rem;
      letter-spacing: 2px;
      color: #22c55e;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(34, 197, 94, 0.4);
    }

    p {
      margin: 4px 0 0 0;
      font-size: 0.85rem;
      color: #9ca3af;
    }

    .watermark {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 9999;
      font-family: 'Arial Black', Arial, sans-serif;
      font-size: 0.8rem;
      color: #ffffff !important;
      text-decoration: none;
      letter-spacing: 1px;
      background: rgba(0, 0, 0, 0.6);
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      pointer-events: auto;
      transition: all 0.2s ease;
    }

    .watermark:hover {
      background: rgba(0, 0, 0, 0.9);
      border-color: #22c55e;
      color: #22c55e !important;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.4);
    }

    #dino-card {
      position: absolute;
      top: 20px;
      right: -420px;
      width: 380px;
      max-height: calc(100vh - 40px);
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 0;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(12px);
      z-index: 200;
      overflow-y: auto;
      transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #dino-card.active { right: 20px; }

    .card-header {
      position: relative;
      padding: 20px 20px 15px 20px;
      background: #1f2937;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
      border-bottom: 1px solid #374151;
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: bold;
    }

    .close-btn:hover { background: rgba(239, 68, 68, 0.4); }

    .card-header h2 {
      margin: 0 0 8px 0;
      font-size: 1.4rem;
      color: #ffffff;
      padding-right: 30px;
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .threat-CRITICAL { background: #7f1d1d; color: #fca5a5; border: 1px solid #ef4444; }
    .threat-HIGH { background: #7c2d12; color: #fdba74; border: 1px solid #f97316; }
    .threat-MEDIUM { background: #713f12; color: #fde047; border: 1px solid #eab308; }
    .threat-LOW { background: #14532d; color: #86efac; border: 1px solid #22c55e; }

    .card-body { padding: 20px; }

    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.85rem;
    }

    .label { color: #9ca3af; }
    .value { font-weight: 600; color: #e5e7eb; }

    .section-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: #22c55e;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 20px;
      margin-bottom: 8px;
    }

    .info-box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 0.85rem;
      line-height: 1.4;
      color: #d1d5db;
    }

    .wiki-link {
      display: inline-flex;
      align-items: center;
      margin-top: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #3b82f6;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: color 0.2s ease;
    }

    .wiki-link:hover {
      color: #60a5fa;
      text-decoration: underline;
    }
  </style>

  <script src="//unpkg.com/globe.gl"></script>
  <script src="//unpkg.com/three"></script>
</head>
<body>

  <div class="header">
    <h1>DinoTracker Operations</h1>
    <p>Live Containment & Behavior Field Grid</p>
  </div>

  <div id="globeViz"></div>

  <a href="https://yourlinkhere.com" target="_blank" class="watermark">
    ©2026 NEXTILE COPYRIGHT RESREVED
  </a>

  <div id="dino-card">
    <div class="card-header">
      <button class="close-btn" onclick="closeCard()">✕</button>
      <h2 id="card-name">Species Name</h2>
      <span id="card-threat" class="badge">Threat</span>
    </div>
    <div class="card-body">
      <div class="stat-row"><span class="label">Location:</span><span class="value" id="card-loc">-</span></div>
      <div class="stat-row"><span class="label">Diet:</span><span class="value" id="card-diet">-</span></div>
      <div class="stat-row"><span class="label">Length:</span><span class="value" id="card-length">-</span></div>
      <div class="stat-row"><span class="label">Coordinates:</span><span class="value" id="card-coords">-</span></div>

      <div class="section-title">Behavioral Field Report</div>
      <div class="info-box" id="card-behavior">-</div>
      
      <a id="card-wiki" href="#" target="_blank" class="wiki-link">Learn More ↗</a>

      <div class="section-title">Containment & Advisory Protocol</div>
      <div class="info-box" id="card-protocol">-</div>
    </div>
  </div>

  <script>
    const dinoSightings = [
      { 
        name: "Biosyn Headquarters", lat: 46.4100, lng: 11.8500, location: "Dolomites, Italy", threat: "CRITICAL", diet: "N/A (Research Facility)", length: "Valley Complex",
        customColor: "#3b82f6",
        hasBeam: true,
        customUrl: "https://jurassicpark.fandom.com/wiki/Biosyn_Research_Facility",
        behavior: "High-security global genetics research facility and prehistoric sanctuary tucked in the Italian Dolomites. Conducts apex cloning, containment, and bio-engineering operations.",
        protocol: "Restricted valley airspace. Level-5 security clearance required for valley perimeter passage."
      },
      { 
        name: "Tyrannosaurus Rex", lat: 40.7128, lng: -74.0060, location: "New York, USA", threat: "CRITICAL", diet: "Carnivore", length: "12.3m",
        behavior: "Apex solitary predator. Displays ambush hunting behaviors around urban transit routes. Highly sensitive to ground vibrations.",
        protocol: "Evacuate a 2-mile radius immediately. Do not run in open spaces. Heavy armored containment vehicles required."
      },
      { 
        name: "Velociraptor", lat: 51.5074, lng: -0.1278, location: "London, UK", threat: "HIGH", diet: "Carnivore", length: "2.0m",
        behavior: "Pack hunter demonstrating high problem-solving intelligence. Known to stalk targets from flanks using structure cover.",
        protocol: "Maintain 360-degree perimeter awareness. Never travel alone. Thermal tracking cameras mandatory."
      },
      { 
        name: "Spinosaurus", lat: 30.0444, lng: 31.2357, location: "Cairo, Egypt", threat: "CRITICAL", diet: "Piscivore / Opportunistic Carnivore", length: "15.0m",
        behavior: "Semi-aquatic and highly territorial around major waterways. Attacks both surface vessels and shoreline wildlife.",
        protocol: "Clear all harbor and river traffic. Deploy sonar disruption arrays to prevent shoreline approaches."
      },
      { 
        name: "Triceratops", lat: -33.8688, lng: 151.2093, location: "Sydney, Australia", threat: "LOW", diet: "Herbivore", length: "9.0m",
        behavior: "Generally non-aggressive unless startled or cornered. Herding instinct; prone to sudden territorial charges if approached quickly.",
        protocol: "Keep a distance of at least 50 meters. Avoid sudden movement or loud mechanized noises."
      },
      { 
        name: "Brachiosaurus", lat: -22.9068, lng: -43.1729, location: "Rio de Janeiro, Brazil", threat: "LOW", diet: "Herbivore", length: "23.0m",
        behavior: "Docile sauropod moving in small family units. Forages high canopy foliage and causes accidental structural damage due to mass.",
        protocol: "Reroute overhead traffic and powerlines. Establish gentle acoustic boundaries to guide away from residential zones."
      },
      { 
        name: "Dilophosaurus", lat: 35.6762, lng: 139.6503, location: "Tokyo, Japan", threat: "MEDIUM", diet: "Carnivore", length: "7.0m",
        behavior: "Nocturnal stalker. Emits soft vocal trills before spitting a blinding neurotoxic venom prior to striking.",
        protocol: "Full face-shield protection mandatory for field responders. Keep high-intensity floodlights operational."
      },
      { 
        name: "Mosasaurus", lat: 25.0343, lng: -77.3963, location: "Nassau, Bahamas", threat: "CRITICAL", diet: "Carnivore", length: "17.0m",
        behavior: "Deep-ocean apex predator. Capable of ambushing surface vessels and dragging large marine life underwater.",
        protocol: "Issue immediate maritime red alert. Suspend all coastal swimming and boat charters."
      }
    ];

    const getColor = item => {
      if (item.customColor) return item.customColor;
      switch(item.threat) {
        case 'CRITICAL': return '#ef4444';
        case 'HIGH': return '#f97316';
        case 'MEDIUM': return '#eab308';
        case 'LOW': return '#22c55e';
        default: return '#3b82f6';
      }
    };

    // Filter locations that get the thick 3D vertical beam
    const customBeamData = dinoSightings.filter(d => d.hasBeam);

    const world = Globe()
      (document.getElementById('globeViz'))
      .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
      .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')

      /* --- REAL THICK 3D CYLINDER VERTICAL BEAM --- */
      .customLayerData(customBeamData)
      .customThreeObject(d => {
        // Create genuine 3D Cylinder geometry (radiusTop, radiusBottom, height, segments)
        // Increase 2.5 to make it even THICKER if needed!
        const beamRadius = 2.5; 
        const beamHeight = 95; 
        const geometry = new THREE.CylinderGeometry(beamRadius, beamRadius, beamHeight, 32);

        // Position cylinder base at origin, extending upward along Y
        geometry.translate(0, beamHeight / 2, 0);

        // Translucent glowing material
        const material = new THREE.MeshBasicMaterial({
          color: 0x00a2ff,
          transparent: true,
          opacity: 0.65,
          side: THREE.DoubleSide
        });

        return new THREE.Mesh(geometry, material);
      })
      .customThreeObjectUpdate((obj, d) => {
        Object.assign(obj.position, world.getCoords(d.lat, d.lng, 0));
      })

      .ringsData(dinoSightings)
      .ringColor(d => t => {
        if (d.customColor) return `rgba(59, 130, 246, ${(1 - t) * 0.7})`;
        const c = d.threat === 'CRITICAL' ? '239, 68, 68' : d.threat === 'HIGH' ? '249, 115, 22' : '34, 197, 94';
        return `rgba(${c}, ${1 - t})`;
      })
      .ringMaxRadius(d => d.hasBeam ? 10 : 4)
      .ringPropagationSpeed(d => d.hasBeam ? 4.0 : 2.5)
      .ringRepeatPeriod(1200)

      .pointsData(dinoSightings)
      .pointColor(d => getColor(d))
      .pointAltitude(d => d.hasBeam ? 0.05 : 0.02)
      .pointRadius(d => d.hasBeam ? 1.2 : 0.5)
      .onPointClick(point => {
        world.pointOfView({ lat: point.lat, lng: point.lng, altitude: 1.6 }, 1000);
        openCard(point);
      });

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.4;

    window.addEventListener('resize', () => {
      world.width(window.innerWidth);
      world.height(window.innerHeight);
    });

    function openCard(data) {
      document.getElementById('card-name').innerText = data.name;
      document.getElementById('card-loc').innerText = data.location;
      document.getElementById('card-diet').innerText = data.diet;
      document.getElementById('card-length').innerText = data.length;
      document.getElementById('card-coords').innerText = `${data.lat.toFixed(2)}°, ${data.lng.toFixed(2)}°`;
      document.getElementById('card-behavior').innerText = data.behavior;
      document.getElementById('card-protocol').innerText = data.protocol;
      
      const wikiBtn = document.getElementById('card-wiki');
      if (data.customUrl) {
        wikiBtn.href = data.customUrl;
        wikiBtn.innerText = "Learn More ↗";
      } else {
        const wikiQuery = encodeURIComponent(data.name);
        wikiBtn.href = `https://en.wikipedia.org/wiki/${wikiQuery}`;
        wikiBtn.innerText = "Learn More on Wikipedia ↗";
      }

      const threatBadge = document.getElementById('card-threat');
      threatBadge.innerText = `${data.threat} THREAT`;
      threatBadge.className = `badge threat-${data.threat}`;
      
      document.getElementById('dino-card').classList.add('active');
    }

    function closeCard() {
      document.getElementById('dino-card').classList.remove('active');
    }
  </script>
</body>
</html>
